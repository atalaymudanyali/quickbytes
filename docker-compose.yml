services:
  postgres:
    # Multi-arch build of the PostGIS image (the official one is amd64 only).
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: quickbytes
      POSTGRES_PASSWORD: quickbytes
      POSTGRES_DB: quickbytes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbytes -d quickbytes"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.0-alpine
    # Used only as a cache, so:
    #   --save "" --appendonly no   keep nothing on disk; a restart starts empty
    #   --maxmemory 64mb            never grow beyond 64 MB
    #   allkeys-lru                 when full, drop the least recently used keys
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://quickbytes:quickbytes@postgres:5432/quickbytes?sslmode=disable
      # Development-only secret. Real deployments set their own, never committed.
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
      # Set API_REDIS_URL to an empty value to run without the cache
      # (make load-menu does that for its "no cache" run).
      REDIS_URL: ${API_REDIS_URL-redis://redis:6379/0}
      # How long an order may wait for payment, and how often that's checked.
      # Shorten them to watch an order expire: ORDER_PAY_WINDOW=1m make up
      ORDER_PAY_WINDOW: ${ORDER_PAY_WINDOW-15m}
      ORDER_EXPIRY_EVERY: ${ORDER_EXPIRY_EVERY-30s}
      # How often idempotency keys older than 24 hours are deleted.
      IDEMPOTENCY_CLEANUP_EVERY: ${IDEMPOTENCY_CLEANUP_EVERY-10m}
      # The payment provider, and QuickBytes' merchant key there (the same
      # development key as PAYPROVIDER_MERCHANT_KEY below). A call that takes
      # longer than PAYPROVIDER_TIMEOUT counts as unanswered.
      PAYPROVIDER_URL: http://payprovider:8090
      PAYPROVIDER_KEY: sk_test_dev_only_quickbytes_0123456789abcdef
      PAYPROVIDER_TIMEOUT: ${PAYPROVIDER_TIMEOUT-5s}
      # Checks the provider's webhook signatures: the same development-only
      # secret as the provider's WEBHOOK_SECRET below.
      PAYPROVIDER_WEBHOOK_SECRET: whsec_dev_only_quickbytes_0123456789abcdef
      # How often the reconcile loop settles payments that need work.
      PAYMENT_RECONCILE_EVERY: ${PAYMENT_RECONCILE_EVERY-5s}
      # Publish order events from the outbox to Redpanda. Turn the relay off to
      # watch events pile up in the outbox: OUTBOX_RELAY=false make up
      OUTBOX_RELAY: ${OUTBOX_RELAY-true}
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Started first, but not waited for: a provider that's down only makes
      # payments unknown until it's back, which the API is built to handle.
      payprovider:
        condition: service_started
      # Started first, but not required to be healthy: the API works without
      # its cache (it reads from the database instead).
      redis:
        condition: service_started
      # Started first, but not waited for either: while Redpanda is down,
      # order events wait in the outbox and go out once it's back.
      redpanda:
        condition: service_started

  # The mock payment provider: a fake card processor playing an outside company
  # (Stripe, iyzico). Its own database in the same Postgres container, no tables
  # shared with the API.
  payprovider:
    build:
      context: .
      args:
        SERVICE: payprovider
    environment:
      DATABASE_URL: postgres://quickbytes:quickbytes@postgres:5432/payprovider?sslmode=disable
      # Development-only merchant key for QuickBytes. Real deployments set their
      # own, never committed. Send it as: Authorization: Bearer <key>
      PAYPROVIDER_MERCHANT_KEY: sk_test_dev_only_quickbytes_0123456789abcdef
      # How long the slow test card's payment stays processing before it's
      # authorized. Change it like: SLOW_CARD_DELAY=30s make up
      SLOW_CARD_DELAY: ${SLOW_CARD_DELAY-10s}
      # Where the provider sends its webhooks (payment.authorized...), signed
      # with this development-only secret; the API checks them with the same
      # one. An empty WEBHOOK_URL turns webhooks off: WEBHOOK_URL= make up
      WEBHOOK_URL: ${WEBHOOK_URL-http://api:8080/webhooks/payprovider}
      WEBHOOK_SECRET: whsec_dev_only_quickbytes_0123456789abcdef
      # Test switch: post every webhook twice, to show the API handles the
      # repeat only once. Turn it on like: WEBHOOK_SEND_TWICE=true make up
      WEBHOOK_SEND_TWICE: ${WEBHOOK_SEND_TWICE-false}
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  # The event stream (Kafka's protocol, one small container). The API publishes
  # order events to its "orders" topic; `make topics` creates that topic.
  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      # Development settings: one CPU core, a small memory budget, no
      # production checks.
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      # Two doors into the same broker: containers use redpanda:9092, this
      # machine (make run, rpk on the host) uses localhost:19092. Each door
      # tells clients the address to come back on.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A web page to browse topics and messages, only started by `make console`
  # (the "console" profile keeps it out of `make up`).
  console:
    image: redpandadata/console:v3.12.0
    profiles: [console]
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # Load-testing tool, only started by `make load-menu` (the "tools" profile
  # keeps it out of `make up`).
  k6:
    image: grafana/k6:1.3.0
    profiles: [tools]
    environment:
      BASE_URL: http://api:8080
    volumes:
      - ./scripts:/scripts:ro

volumes:
  pgdata:
  redpanda:
