openapi: 3.0.3

info:
  title: QuickBytes API
  version: 0.1.0
  description: |
    Backend for QuickBytes, a food delivery platform set in Istanbul.

    **Logging in.** `POST /auth/login` (or `/auth/signup`) returns a short-lived
    access token and a refresh token. Send the access token on protected requests as
    `Authorization: Bearer <access_token>`. When it expires (after 15 minutes), swap
    the refresh token for a new pair at `POST /auth/refresh`. Each refresh token works
    once.

    **Errors** always have the same shape: `{"error": {"code", "message", "request_id"}}`.
    `code` is stable and meant for programs; `message` is for people. Every response
    carries an `X-Request-ID` header that matches the server's log line for it.

    **Money** is always a whole number of kuruş: `32000` means 320,00 TL.

servers:
  - url: http://localhost:8080
    description: Local development (`make up`)

tags:
  - name: health
    description: Is the service alive and able to work?
  - name: auth
    description: Sign up, log in, and keep a session going.
  - name: profiles
    description: The roles a user can play (customer, restaurant owner, driver).
  - name: addresses
    description: A customer's saved delivery addresses.
  - name: cart
    description: The customer's basket. One per customer, for one restaurant at a time, priced live from the menu.
  - name: orders
    description: Checkout, following an order through its statuses, and the restaurant's side of it.
  - name: restaurants
    description: Finding and managing restaurants.
  - name: menus
    description: Reading and managing a restaurant's menu.
  - name: webhooks
    description: Called by the payment provider, not by apps.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Is the process alive?
      description: Never checks dependencies, so a database outage doesn't get healthy copies restarted.
      responses:
        "200":
          description: The process is running.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Can this copy serve traffic right now?
      description: Checks that the database answers. A load balancer stops sending requests to a copy that isn't ready.
      responses:
        "200":
          description: Ready.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready] }
        "503":
          description: The database can't be reached (code `unavailable`).
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account and log in
      description: |
        The new user gets a customer profile, and the response includes a token pair, so signing up also logs in.

        Limit (answered with 429): 10 sign-ups per hour from one IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Account created and logged in.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithTokens" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "409":
          description: An account with this email already exists (code `email_taken`).
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in. A new token family is started.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithTokens" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401":
          description: |
            Email or password is incorrect (code `invalid_credentials`). An unknown email
            and a wrong password give the same answer, in the same time.

            Limits (answered with 429): 20 attempts per minute from one IP; 5 failures
            per 15 minutes for one email from one IP (a successful login resets this);
            50 failures per hour for one email from any IP.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Swap a refresh token for a new token pair
      description: |
        Each refresh token works once and is replaced by the one in the response. Sending
        an already-used token revokes every token from that login (possible theft), and
        the user has to log in again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: A new token pair. The roles in the new access token are read fresh, so newly added profiles appear.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401":
          description: The refresh token is invalid, expired, revoked or already used (code `invalid_refresh_token`).
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: Log out
      description: |
        Revokes the refresh token and every token from the same login. Always succeeds,
        even for unknown tokens. The current access token keeps working until it
        expires (at most 15 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: Logged out.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /me:
    get:
      tags: [profiles]
      operationId: getMe
      summary: The signed-in user and their profiles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current user.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/profiles:
    post:
      tags: [profiles]
      operationId: addProfile
      summary: Add a restaurant or driver profile
      description: |
        The current access token doesn't list the new role yet. Call `POST /auth/refresh`
        afterwards to get one that does.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [restaurant, driver]
                  description: Every user already has a customer profile.
      responses:
        "201":
          description: Profile added.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: The user already has this profile (code `profile_exists`).
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/addresses:
    get:
      tags: [addresses]
      operationId: listMyAddresses
      summary: The signed-in customer's delivery addresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The customer's addresses, oldest first.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
    post:
      tags: [addresses]
      operationId: createAddress
      summary: Save a delivery address
      description: |
        The app sends the text and the map pin together: turning text into
        coordinates would need a paid service. A customer can save up to 10.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressCreate" }
      responses:
        "201":
          description: Saved.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "409":
          description: Already 10 addresses saved (code `address_limit_reached`). Delete one first.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/addresses/{address_id}:
    parameters:
      - $ref: "#/components/parameters/AddressID"
    patch:
      tags: [addresses]
      operationId: updateAddress
      summary: Change a delivery address
      description: Only the fields sent are changed. `lat` and `lng` must be sent together.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressPatch" }
      responses:
        "200":
          description: The updated address.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/AddressNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [addresses]
      operationId: deleteAddress
      summary: Delete a delivery address
      security:
        - bearerAuth: []
      responses:
        "204": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/AddressNotFound" }

  /cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: The signed-in customer's cart, priced now
      description: |
        Prices are never stored in the cart: every response works them out from the
        menu as it is right now, so a price change shows up at once. Dishes that
        can't be ordered as they are stay in the cart with a `problem` and no price.
        A customer without a cart gets an empty one (`restaurant: null`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The cart.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
    delete:
      tags: [cart]
      operationId: clearCart
      summary: Empty the cart
      description: Afterwards dishes from any restaurant can be added. Clearing an empty cart is fine too.
      security:
        - bearerAuth: []
      responses:
        "204": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }

  /cart/items:
    post:
      tags: [cart]
      operationId: addToCart
      summary: Add a dish to the cart
      description: |
        The first dish makes the cart and ties it to that dish's restaurant. The same
        dish with the same choices adds to the quantity of the line already there.
        The choices are checked against the dish's option rules.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemAdd" }
      responses:
        "200":
          description: The whole cart after adding.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404":
          description: No such dish on any menu (code `item_not_found`), including archived ones.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/CartConflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/CartRejected" }

  /cart/items/{item_id}:
    parameters:
      - $ref: "#/components/parameters/CartItemID"
    patch:
      tags: [cart]
      operationId: changeCartItem
      summary: Change a line's quantity or choices
      description: |
        Send `quantity`, `choice_ids`, or both. New choices are checked like on add.
        If the change makes this line a copy of another line (same dish, same
        choices), the two become one line. To take a line out, use DELETE.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemPatch" }
      responses:
        "200":
          description: The whole cart after the change.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/CartItemNotFound" }
        "409": { $ref: "#/components/responses/CartConflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/CartRejected" }
    delete:
      tags: [cart]
      operationId: removeCartItem
      summary: Take a line out of the cart
      description: Taking out the last line empties the cart, so dishes from any restaurant can be added next.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The whole cart after removing.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/CartItemNotFound" }

  /orders:
    post:
      tags: [orders]
      operationId: placeOrder
      summary: Check out the cart
      description: |
        Turns the whole cart into an order sent to one of your saved addresses, and
        empties the cart. Names, prices and the address are **copied** into the
        order, so later changes to the menu or your address book never change it.

        **Payment.** The card is authorized at once: the amount is held on it,
        and taken only when the restaurant accepts. The answer shows how that
        went, in `status` and `payment`:

        | Card answer | `status` | `payment.status` |
        |---|---|---|
        | Approved | `paid` | `authorized` |
        | Declined (or not a card the provider takes) | `cancelled` (`payment_failed`) | `failed` |
        | Still deciding (slow card) | `placed` | `processing` |
        | No answer from the provider in time | `placed` | `unknown` |

        For `processing` and `unknown`, watch the order (`GET /orders/{order_id}`):
        the backend keeps asking the provider and moves it on. A timeout never
        charges twice: the card is never authorized again. A `placed` order not
        paid within 15 minutes is cancelled with reason `expired`.

        Use the payment provider's test cards only (see the README), such as
        `4242424242424242` (approved) or `4000000000000002` (declined). Only the
        last four digits are kept.

        **Safe to retry.** Send an `Idempotency-Key` header: a new random value
        (a UUID) for each tap on "Place order", and the **same** value when
        retrying that tap (after a timeout or a lost connection). The first
        attempt does the work; a retry gets the first attempt's answer again,
        status and body, with `Idempotent-Replayed: true`, so one tap never
        becomes two orders. That holds for refusals too: if the first answer
        was `409 cart_empty`, the retry gets that again. Keys are kept for 24
        hours and belong to your account. A retry that arrives while the card is
        still being authorized gets the order as it was before (`placed`,
        payment `pending`); once the answer is in, retries get the final one.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreate" }
      responses:
        "201":
          description: The new order, with its history and its payment (see the table above).
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderWithPayment" }
        "400": { $ref: "#/components/responses/InvalidJSONOrIdempotencyKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "409": { $ref: "#/components/responses/CheckoutConflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/CheckoutRejected" }
    get:
      tags: [orders]
      operationId: listMyOrders
      summary: Your orders, newest first
      description: The newest 50 orders, with their items. Use `GET /orders/{order_id}` for one order's history.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The orders.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }

  /orders/{order_id}:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    get:
      tags: [orders]
      operationId: getOrder
      summary: One of your orders, with its status history and payment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderWithPayment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/OrderNotFound" }

  /orders/{order_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel your order
      description: |
        Possible while the order is `placed` or `paid`, before the restaurant
        accepts it. The order becomes `cancelled` with reason `by_customer`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order after cancelling.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderWithPayment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/OrderNotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /orders/{order_id}/accept:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    post:
      tags: [orders]
      operationId: acceptOrder
      summary: Accept an order (restaurant)
      description: "For the restaurant's owner. A `paid` order becomes `accepted`: the kitchen starts cooking. (From a later version, this is also when the payment is taken.)"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order after the move, with its history.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderWithHistory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/OrderNotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /orders/{order_id}/reject:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    post:
      tags: [orders]
      operationId: rejectOrder
      summary: Reject an order (restaurant)
      description: "For the restaurant's owner. A `paid` or `accepted` order becomes `cancelled` with reason `rejected`, e.g. when the kitchen runs out of something."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order after the move, with its history.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderWithHistory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/OrderNotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /orders/{order_id}/ready:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    post:
      tags: [orders]
      operationId: markOrderReady
      summary: Mark an order ready (restaurant)
      description: "For the restaurant's owner. An `accepted` order becomes `ready` for pickup."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order after the move, with its history.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderWithHistory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/OrderNotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /webhooks/payprovider:
    post:
      tags: [webhooks]
      operationId: receivePayProviderWebhook
      summary: The payment provider tells us about a payment
      description: |
        Called by the payment provider (not by apps) when one of our payments is
        decided or moves: the fast way to learn that a slow card was approved,
        instead of waiting for the backend to ask. The backend still asks about
        payments it hasn't heard of in a while, in case a webhook never comes.

        **No login: the signature is the proof.** `QB-Signature` carries
        `t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">` made with the
        shared webhook secret. A wrong or missing signature, or a `t` more than 5
        minutes from our clock (a replay), is refused with `400` and changes
        nothing.

        **Safe to send again.** Webhooks arrive at least once and in no
        particular order. An event `id` seen before is answered `200` with
        outcome `repeat` and does nothing; an event older than what we know
        (an `authorized` after a `captured`) changes nothing either (outcome
        `stale`): a payment's status never goes backwards.

        **Outcomes** (`200`): `applied` (it changed the payment, and maybe paid
        or cancelled the order), `stale`, `repeat`, `unmatched` (about no payment
        of ours), `mismatch` (our payment, another amount: not trusted),
        `ignored` (a genuine event of a type we don't handle).
      parameters:
        - name: QB-Signature
          in: header
          required: true
          description: The webhook's signature, see above.
          schema: { type: string, example: "t=1792927973,v1=5fcc867543df15ab2d73a277a81f74cfee9688f3b0312ba724e693e4bad98cc6" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "200":
          description: Handled, or handled before. The provider stops sending it.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [outcome]
                additionalProperties: false
                properties:
                  outcome:
                    type: string
                    enum: [applied, stale, repeat, unmatched, mismatch, ignored]
        "400":
          description: "`invalid_webhook`: the signature is missing, wrong or too old, or the body isn't a webhook. Nothing was changed."
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "`body_too_large`: the body is over 64 KiB."
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: "`internal`: something failed on our side. Nothing was changed and the event wasn't marked as seen, so the provider's next try is handled."
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /restaurants:
    get:
      tags: [restaurants]
      operationId: searchRestaurants
      summary: Restaurants that deliver to a point
      description: |
        Returns restaurants whose delivery zone contains the point, closest first, with
        the distance in metres. Restaurants not accepting orders are included with their
        flag. Paginated: send `next_cursor` back as `cursor` to get the next page; it's
        `null` on the last page. No login needed.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Latitude" }
        - name: lng
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Longitude" }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: The `next_cursor` from the previous page. Opaque; send it back unchanged.
          schema: { type: string }
      responses:
        "200":
          description: One page of results.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [restaurants, next_cursor]
                properties:
                  restaurants:
                    type: array
                    items: { $ref: "#/components/schemas/NearbyRestaurant" }
                  next_cursor:
                    type: string
                    nullable: true
                    description: Send as `cursor` for the next page. `null` on the last page.
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [restaurants]
      operationId: createRestaurant
      summary: Create a restaurant
      description: Needs a restaurant profile. The delivery radius defaults to 3 km, delivery is free and there is no minimum basket unless set, and new restaurants accept orders.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestaurantCreate" }
      responses:
        "201":
          description: Created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /restaurants/{id}:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
    get:
      tags: [restaurants]
      operationId: getRestaurant
      summary: One restaurant
      description: No login needed.
      responses:
        "200":
          description: The restaurant.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
        "404": { $ref: "#/components/responses/RestaurantNotFound" }
    patch:
      tags: [restaurants]
      operationId: updateRestaurant
      summary: Change a restaurant
      description: Only the fields sent are changed. `lat` and `lng` must be sent together. Another owner's restaurant gets the same 404 as a missing one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestaurantPatch" }
      responses:
        "200":
          description: The updated restaurant.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/RestaurantNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/restaurants:
    get:
      tags: [restaurants]
      operationId: listMyRestaurants
      summary: The signed-in owner's restaurants
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The owner's restaurants, oldest first.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                type: object
                required: [restaurants]
                properties:
                  restaurants:
                    type: array
                    items: { $ref: "#/components/schemas/Restaurant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }

  /restaurants/{id}/menu:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
    get:
      tags: [menus]
      operationId: getMenu
      summary: A restaurant's menu
      description: |
        Sections and dishes in the owner's order. Sold-out dishes are included with
        `"available": false` (show them greyed out); archived sections and dishes are left
        out. No login needed.

        Served from a cache when possible. A change to the menu is visible on the
        next read.

        Every response carries an `ETag`. Send it back in `If-None-Match`: if the menu
        hasn't changed, the answer is an empty `304 Not Modified` and the app keeps
        using its stored copy.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a menu the app already has (or several, comma-separated, or `*`).
          schema: { type: string }
          example: '"menu2-01a14bab-224e-7468-8920-42d59bbb55ee-v7"'
      responses:
        "200":
          description: The menu.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            ETag: { $ref: "#/components/headers/MenuETag" }
            X-Cache:
              description: "Where the menu came from: `HIT` (the cache), `MISS` (the database, now cached), `BYPASS` (the database; no cache available). For debugging; clients can ignore it."
              schema: { type: string, enum: [HIT, MISS, BYPASS] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Menu" }
        "304":
          description: Not modified. `If-None-Match` names the current menu, so the app's copy is still right. No body.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            ETag: { $ref: "#/components/headers/MenuETag" }
        "404": { $ref: "#/components/responses/RestaurantNotFound" }

  /me/restaurants/{id}/orders:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
    get:
      tags: [orders]
      operationId: listKitchenOrders
      summary: A restaurant's orders to work on
      description: |
        For the restaurant's owner: its `paid`, `accepted` and `ready` orders,
        oldest first (the order to cook them in), up to 50, with their dishes.
        Unpaid (`placed`) orders aren't shown: nothing should be cooked before it's paid.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The orders.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/RestaurantNotFound" }

  /me/restaurants/{id}/menu:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
    get:
      tags: [menus]
      operationId: getOwnerMenu
      summary: The owner's full menu
      description: Like the public menu, but archived sections and dishes are included, with `archived_at` set, so they can be restored.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full menu.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Menu" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/RestaurantNotFound" }

  /restaurants/{id}/menu/categories:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
    post:
      tags: [menus]
      operationId: createCategory
      summary: Add a menu section
      description: Added at the end of the menu.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/CategoryName" }
      responses:
        "201":
          description: Created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/RestaurantNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /restaurants/{id}/menu/categories/order:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
    put:
      tags: [menus]
      operationId: reorderCategories
      summary: Set the order of the menu's sections
      description: |
        Send every visible (not archived) section exactly once, in the new order. A list
        that's incomplete, repeats a section or includes another menu's gets a 422, and
        nothing moves. Safe to repeat.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category_ids]
              properties:
                category_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The owner's menu in its new order.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Menu" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/RestaurantNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /restaurants/{id}/menu/categories/{category_id}:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/CategoryID"
    patch:
      tags: [menus]
      operationId: updateCategory
      summary: Rename, archive or restore a section
      description: Archiving hides the section and everything in it from customers. Its dishes keep their own archived state, so restoring brings back exactly what was visible.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/CategoryName" }
                archived: { type: boolean, description: "true: remove from the menu. false: restore." }
      responses:
        "200":
          description: The updated section.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/MenuEntryNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /restaurants/{id}/menu/categories/{category_id}/order:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/CategoryID"
    put:
      tags: [menus]
      operationId: reorderItems
      summary: Set the order of the dishes in a section
      description: Send every visible dish of the section exactly once, in the new order. Same rules as reordering sections. The section must not be archived.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [item_ids]
              properties:
                item_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The owner's menu in its new order.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Menu" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/MenuEntryNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /restaurants/{id}/menu/items:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
    post:
      tags: [menus]
      operationId: createItem
      summary: Add a dish
      description: Added at the end of its section. The section must belong to this restaurant and not be archived (otherwise 422 on `category_id`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category_id, name, price_kurus]
              properties:
                category_id: { type: string, format: uuid }
                name: { $ref: "#/components/schemas/ItemName" }
                description: { $ref: "#/components/schemas/ItemDescription" }
                price_kurus: { $ref: "#/components/schemas/PriceKurus" }
      responses:
        "201":
          description: Created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/RestaurantNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /restaurants/{id}/menu/items/{item_id}:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/ItemID"
    patch:
      tags: [menus]
      operationId: updateItem
      summary: Change a dish
      description: |
        Only the fields sent are changed. Mark sold out with `"available": false`, remove
        from the menu with `"archived": true`, restore with `"archived": false`. Moving to
        another section (`category_id`) puts the dish at the end of it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                category_id: { type: string, format: uuid }
                name: { $ref: "#/components/schemas/ItemName" }
                description: { $ref: "#/components/schemas/ItemDescription" }
                price_kurus: { $ref: "#/components/schemas/PriceKurus" }
                available: { type: boolean, description: "false: sold out for now (shown greyed out)." }
                archived: { type: boolean, description: "true: remove from the menu. false: restore." }
      responses:
        "200":
          description: The updated dish.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/MenuEntryNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /restaurants/{id}/menu/items/{item_id}/option-groups:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/ItemID"
    post:
      tags: [menus]
      operationId: createOptionGroup
      summary: Add an option group to a dish
      description: |
        A question the dish asks, e.g. "Size: pick exactly 1" (`min_picks: 1, max_picks: 1`)
        or "Extras: up to 3" (`min_picks: 0, max_picks: 3`). Added after the dish's other
        groups. Works on archived dishes too, so options can be prepared before restoring.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, min_picks, max_picks]
              properties:
                name: { $ref: "#/components/schemas/OptionGroupName" }
                min_picks: { $ref: "#/components/schemas/MinPicks" }
                max_picks: { $ref: "#/components/schemas/MaxPicks" }
      responses:
        "201":
          description: Created, without choices yet.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionGroup" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/MenuEntryNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /restaurants/{id}/menu/option-groups/{group_id}:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/OptionGroupID"
    patch:
      tags: [menus]
      operationId: updateOptionGroup
      summary: Change an option group
      description: |
        Only the fields sent are changed. `min_picks` may not end up above `max_picks`; when
        only one is sent, it's compared with the stored other (422 on `min_picks`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/OptionGroupName" }
                min_picks: { $ref: "#/components/schemas/MinPicks" }
                max_picks: { $ref: "#/components/schemas/MaxPicks" }
      responses:
        "200":
          description: The updated group, without its choices (the menu lists those).
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionGroup" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/MenuEntryNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [menus]
      operationId: deleteOptionGroup
      summary: Delete an option group and its choices
      description: |
        A real delete, not an archive. To take a choice off for a while, set its
        `available` to false instead. Past orders keep their own copy of names and prices.
      security:
        - bearerAuth: []
      responses:
        "204": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/MenuEntryNotFound" }

  /restaurants/{id}/menu/option-groups/{group_id}/choices:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/OptionGroupID"
    post:
      tags: [menus]
      operationId: createOptionChoice
      summary: Add a choice to an option group
      description: Added after the group's other choices. `extra_price_kurus` defaults to 0 (no extra charge).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/OptionChoiceName" }
                extra_price_kurus: { $ref: "#/components/schemas/ExtraPriceKurus" }
      responses:
        "201":
          description: Created.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionChoice" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/MenuEntryNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /restaurants/{id}/menu/option-choices/{choice_id}:
    parameters:
      - $ref: "#/components/parameters/RestaurantID"
      - $ref: "#/components/parameters/OptionChoiceID"
    patch:
      tags: [menus]
      operationId: updateOptionChoice
      summary: Change an option choice
      description: |
        Only the fields sent are changed. Switch off for a while with `"available": false`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/OptionChoiceName" }
                extra_price_kurus: { $ref: "#/components/schemas/ExtraPriceKurus" }
                available: { type: boolean, description: "false: out for now (shown greyed out, can't be picked)." }
      responses:
        "200":
          description: The updated choice.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptionChoice" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/MenuEntryNotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [menus]
      operationId: deleteOptionChoice
      summary: Delete an option choice
      security:
        - bearerAuth: []
      responses:
        "204": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileRequired" }
        "404": { $ref: "#/components/responses/MenuEntryNotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `access_token` from login, sign-up or refresh. Valid for 15 minutes.

  headers:
    RequestID:
      description: A unique ID for this request, also written in the server's log. A client may send its own (letters, digits, `.`, `_`, `-`, up to 64 characters).
      schema: { type: string }
    RetryAfter:
      description: How many seconds to wait before trying again.
      schema: { type: integer, minimum: 1, example: 742 }
    IdempotentReplayed:
      description: Present (`true`) when this answer was stored by an earlier attempt with the same `Idempotency-Key` and is sent again, without doing the work again.
      schema: { type: string, enum: ["true"] }
    MenuETag:
      description: A label for this exact version of the menu; it changes whenever the menu does. Send it back in `If-None-Match`.
      schema: { type: string, example: '"menu2-01a14bab-224e-7468-8920-42d59bbb55ee-v7"' }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A value of your choice that names one action: a new one per action, the
        same one for every retry of it. 1 to 255 printable ASCII characters, no
        spaces; a random UUID is the usual choice.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: '^[!-~]+$', example: 6f1c3c1e-9a4b-4c1f-8d0e-2b7f5a9c4e21 }
    CartItemID:
      name: item_id
      in: path
      required: true
      description: The cart line's `id` (not the dish's `menu_item_id`). Anything that isn't a UUID gets a 404.
      schema: { type: string }
    AddressID:
      name: address_id
      in: path
      required: true
      description: The address's ID. Anything that isn't a UUID gets a 404.
      schema: { type: string }
    OrderID:
      name: order_id
      in: path
      required: true
      description: The order's ID. Anything that isn't a UUID gets a 404.
      schema: { type: string }
    RestaurantID:
      name: id
      in: path
      required: true
      description: The restaurant's ID. Anything that isn't a UUID gets a 404.
      schema: { type: string }
    CategoryID:
      name: category_id
      in: path
      required: true
      description: The menu section's ID.
      schema: { type: string }
    ItemID:
      name: item_id
      in: path
      required: true
      description: The dish's ID.
      schema: { type: string }
    OptionGroupID:
      name: group_id
      in: path
      required: true
      description: The option group's ID.
      schema: { type: string }
    OptionChoiceID:
      name: choice_id
      in: path
      required: true
      description: The option choice's ID.
      schema: { type: string }

  responses:
    InvalidJSON:
      description: The body isn't valid JSON for this endpoint, has unknown fields, or contains more than one object (code `invalid_json`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidJSONOrIdempotencyKey:
      description: |
        - `invalid_json`: the body isn't valid JSON for this endpoint, has unknown fields, or contains more than one object.
        - `idempotency_key_missing`: no `Idempotency-Key` header.
        - `idempotency_key_invalid`: the `Idempotency-Key` is empty, longer than 255 characters, or has spaces or non-ASCII characters.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: 'The request has a body that isn''t marked as JSON. Send it with `Content-Type: application/json` (code `unsupported_media_type`).'
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BodyTooLarge:
      description: The body is larger than 1 MiB (code `body_too_large`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Some fields are invalid (code `validation_failed`). `fields` names each one and what's wrong with it.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: some fields are invalid
              fields:
                email: must be a valid email address
                password: must be 8 to 128 characters
              request_id: 0c045729a68d831e5cc32825
    TooManyRequests:
      description: Too many attempts (code `rate_limited`). Wait `Retry-After` seconds, then try again. Limits slow attempts down and reset by themselves; they never lock an account.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: rate_limited
              message: too many attempts, try again later
              request_id: 0c045729a68d831e5cc32825
    Unauthenticated:
      description: No valid access token was sent (code `unauthenticated`). Log in or refresh.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        WWW-Authenticate:
          description: Always `Bearer realm="quickbytes"`.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ProfileRequired:
      description: Logged in, but without the profile this needs, e.g. a customer creating a restaurant (code `profile_required`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RestaurantNotFound:
      description: No such restaurant, or not yours where ownership matters; the two look the same on purpose (code `restaurant_not_found`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AddressNotFound:
      description: No such address, or another customer's; the two look the same on purpose (code `address_not_found`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CartItemNotFound:
      description: No such line in your cart (code `cart_item_not_found`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CartConflict:
      description: |
        The request is fine but the cart or menu says no:
        - `cart_restaurant_mismatch`: the cart has dishes from another restaurant. Clear it (DELETE /cart) to start a new one.
        - `item_unavailable`: the restaurant switched this dish off for now.
        - `restaurant_not_accepting_orders`: the restaurant is paused.
        - `cart_full`: a cart holds up to 30 different lines.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: cart_restaurant_mismatch
              message: your cart has dishes from Hasan Usta Kebap Kadıköy; clear it to start a new one
              request_id: 0c045729a68d831e5cc32825
    CartRejected:
      description: |
        Either invalid fields (code `validation_failed`, e.g. a quantity that would
        go over 20), or choices that don't fit the dish's option rules. Those use the
        option codes (`unknown_choice`, `duplicate_choice`, `choice_unavailable`,
        `too_few_picks`, `too_many_picks`) and say which `group_id` and/or
        `choice_id` it's about.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: too_few_picks
              message: "Boy: pick exactly 1"
              group_id: 01a14bab-224e-7468-8920-42d59bbb55ee
              request_id: 0c045729a68d831e5cc32825
    OrderNotFound:
      description: No such order, or not yours; the two look the same on purpose (code `order_not_found`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CheckoutConflict:
      description: |
        The cart can't become an order as it is:
        - `cart_empty`: nothing to order (or another checkout of this cart just finished).
        - `cart_has_problems`: some lines can't be ordered as they are (see `problem` on `GET /cart`).
        - `cart_changed`: the cart changed while checking out (e.g. from another device). Look at it again and retry.
        - `restaurant_not_accepting_orders`: the restaurant is paused.
        - `below_minimum`: the subtotal is below the restaurant's minimum basket.
        - `idempotency_in_progress`: an earlier attempt with this `Idempotency-Key` is still running. Retry after `Retry-After` seconds to get its answer.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: below_minimum
              message: the minimum basket is 300,00 TL; add 260,00 TL more
              request_id: 0c045729a68d831e5cc32825
    CheckoutRejected:
      description: |
        - `validation_failed`: some fields are invalid; `fields` names each one (e.g. an unknown `address_id`, or a `card_number` that isn't 12 to 19 digits).
        - `idempotency_key_reused`: this `Idempotency-Key` was already used for a different request. Use a new key for a new action.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidTransition:
      description: The order's status doesn't allow this move, e.g. cancelling an order the restaurant already accepted (code `invalid_transition`).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Deleted:
      description: Deleted. No body.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
    MenuEntryNotFound:
      description: The restaurant (code `restaurant_not_found`), section (`category_not_found`), dish (`item_not_found`), option group (`option_group_not_found`) or option choice (`option_choice_not_found`) in the URL doesn't exist or isn't yours.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    WebhookEvent:
      description: |
        A webhook from the payment provider: what happened to which payment.
        `data.payment` is the payment as this event left it, so its `status`
        matches `type` even if the payment has moved on since.
      type: object
      required: [id, type, created_at, data]
      properties:
        id: { type: string, description: "The provider's event ID, the same on every try.", example: 02c4baf7-d82f-4da5-9f30-6a38c707d649 }
        type: { type: string, example: payment.authorized }
        created_at: { type: string, format: date-time }
        data:
          type: object
          required: [payment]
          properties:
            payment:
              type: object
              required: [id, amount_kurus, status]
              properties:
                id: { type: string, description: "The provider's payment ID." }
                amount_kurus: { type: integer, example: 47990 }
                status: { type: string, example: authorized }
                decline_code: { type: string, example: card_declined }
                reference: { type: string, description: Our order ID. }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, for programs to check, e.g. `email_taken`, `invalid_credentials`, `validation_failed`.
              example: email_taken
            message:
              type: string
              description: For people. The wording may change.
              example: an account with this email already exists
            fields:
              type: object
              description: Only for `validation_failed`. Each invalid field and what's wrong with it.
              additionalProperties: { type: string }
            group_id:
              type: string
              format: uuid
              description: Only for option-picking errors. The option group it's about.
            choice_id:
              type: string
              format: uuid
              description: Only for option-picking errors. The choice it's about.
            request_id:
              type: string
              description: The same value as the `X-Request-ID` header.
              example: 0c045729a68d831e5cc32825

    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: A plain address. Upper and lower case count as the same email.
          example: ayse@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 8 to 128 characters (counted as characters, so "ş" is one).
          example: güvenli-şifre
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Ayşe Yılmaz

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, example: ayse@example.com }
        password: { type: string, example: güvenli-şifre }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: The refresh token from the latest login, sign-up or refresh.

    User:
      type: object
      required: [id, email, full_name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, example: ayse@example.com }
        full_name: { type: string, example: Ayşe Yılmaz }
        created_at: { type: string, format: date-time }

    Profile:
      type: object
      required: [id, role, created_at]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [customer, restaurant, driver]
        created_at: { type: string, format: date-time }

    TokenPair:
      type: object
      required: [token_type, access_token, access_expires_at, refresh_token]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
          description: "A JWT. Send it as `Authorization: Bearer <access_token>`. Its payload lists the user's roles."
        access_expires_at:
          type: string
          format: date-time
          description: When the access token stops working (15 minutes after it was issued).
        refresh_token:
          type: string
          description: Works once. Store it securely (the iOS Keychain) and send it to `/auth/refresh`.

    Account:
      type: object
      required: [user, profiles]
      properties:
        user: { $ref: "#/components/schemas/User" }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/Profile" }

    AccountWithTokens:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [tokens]
          properties:
            tokens: { $ref: "#/components/schemas/TokenPair" }

    Latitude:
      type: number
      format: double
      minimum: 40.8
      maximum: 41.6
      description: Latitude (north–south), inside Istanbul.
      example: 40.9917
    Longitude:
      type: number
      format: double
      minimum: 27.95
      maximum: 29.95
      description: Longitude (east–west), inside Istanbul.
      example: 29.0233

    Cart:
      type: object
      required: [restaurant, items, subtotal_kurus, delivery_fee_kurus, total_kurus, min_basket_kurus, below_minimum, kurus_to_minimum]
      properties:
        restaurant:
          description: The restaurant this cart is for; null when the cart is empty.
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CartRestaurant" }]
        items:
          type: array
          description: Lines in the order they were first added.
          items: { $ref: "#/components/schemas/CartLine" }
        subtotal_kurus:
          type: integer
          description: Dishes and extras. Lines with a problem don't count.
          example: 106000
        delivery_fee_kurus:
          type: integer
          description: The restaurant's fee; 0 when nothing in the cart can be ordered.
          example: 2990
        total_kurus:
          type: integer
          description: Subtotal plus delivery fee.
          example: 108990
        min_basket_kurus: { type: integer, example: 30000 }
        below_minimum:
          type: boolean
          description: A warning while shopping. Checkout won't accept a cart below the minimum.
        kurus_to_minimum:
          type: integer
          description: How much more the subtotal needs to reach the minimum; 0 when it's reached.
          example: 0

    CartRestaurant:
      type: object
      required: [id, name, accepting_orders]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Hasan Usta Kebap Kadıköy }
        accepting_orders: { type: boolean }

    CartLine:
      type: object
      required: [id, menu_item_id, name, quantity, options, unit_price_kurus, line_total_kurus, problem]
      properties:
        id:
          type: string
          format: uuid
          description: The line's ID, for PATCH and DELETE /cart/items/{item_id}.
        menu_item_id: { type: string, format: uuid }
        name: { type: string, example: Adana Kebap }
        quantity: { type: integer, minimum: 1, maximum: 20, example: 2 }
        options:
          type: array
          description: The picked choices, in menu order. Empty on a line with a problem.
          items: { $ref: "#/components/schemas/CartOption" }
        unit_price_kurus:
          type: integer
          nullable: true
          description: The dish plus its extras, from today's menu. Null on a line with a problem.
          example: 53000
        line_total_kurus:
          type: integer
          nullable: true
          description: unit_price_kurus × quantity. Null on a line with a problem.
          example: 106000
        problem:
          description: Null when the line can be ordered as it is.
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CartLineProblem" }]

    CartOption:
      type: object
      required: [group_id, group_name, choice_id, choice_name, extra_price_kurus]
      properties:
        group_id: { type: string, format: uuid }
        group_name: { type: string, example: Boy }
        choice_id: { type: string, format: uuid }
        choice_name: { type: string, example: Büyük }
        extra_price_kurus: { type: integer, example: 8000 }

    CartLineProblem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [item_unavailable, item_removed, options_changed]
          description: |
            `item_unavailable`: switched off for now, may come back.
            `item_removed`: no longer on the menu.
            `options_changed`: the picked choices no longer fit the dish (a choice was deleted or switched off, or the rules changed). Change the choices or remove the line.
        message: { type: string, example: Künefe is not available right now }

    CartItemAdd:
      type: object
      additionalProperties: false
      required: [menu_item_id]
      properties:
        menu_item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
        choice_ids:
          type: array
          description: The picked option choices, in any order.
          items: { type: string, format: uuid }
          default: []

    CartItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        quantity: { type: integer, minimum: 1, maximum: 20 }
        choice_ids:
          type: array
          description: Replaces all the line's choices.
          items: { type: string, format: uuid }

    Address:
      type: object
      required: [id, label, address_line, details, lat, lng, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        label: { $ref: "#/components/schemas/AddressLabel" }
        address_line: { $ref: "#/components/schemas/AddressLine" }
        details: { $ref: "#/components/schemas/AddressDetails" }
        lat: { $ref: "#/components/schemas/Latitude" }
        lng: { $ref: "#/components/schemas/Longitude" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AddressCreate:
      type: object
      additionalProperties: false
      required: [label, address_line, lat, lng]
      properties:
        label: { $ref: "#/components/schemas/AddressLabel" }
        address_line: { $ref: "#/components/schemas/AddressLine" }
        details:
          allOf: [{ $ref: "#/components/schemas/AddressDetails" }]
          default: ""
        lat: { $ref: "#/components/schemas/Latitude" }
        lng: { $ref: "#/components/schemas/Longitude" }

    AddressPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Send only what changes. `lat` and `lng` go together.
      properties:
        label: { $ref: "#/components/schemas/AddressLabel" }
        address_line: { $ref: "#/components/schemas/AddressLine" }
        details: { $ref: "#/components/schemas/AddressDetails" }
        lat: { $ref: "#/components/schemas/Latitude" }
        lng: { $ref: "#/components/schemas/Longitude" }

    AddressLabel:
      type: string
      minLength: 1
      maxLength: 30
      description: The customer's own name for it.
      example: Ev
    AddressLine:
      type: string
      minLength: 1
      maxLength: 300
      description: The street address, for the courier to read.
      example: "Caferağa Mh., Moda Cd. No:40, Kadıköy"
    AddressDetails:
      type: string
      maxLength: 200
      description: What a map can't show, such as building, floor, door or "ring twice". May be empty.
      example: "Kat 3, daire 7"

    OrderCreate:
      type: object
      additionalProperties: false
      required: [address_id, card_number]
      properties:
        address_id:
          type: string
          format: uuid
          description: One of your saved addresses (`GET /me/addresses`).
        card_number:
          type: string
          pattern: "^[0-9]{12,19}$"
          description: |
            A payment provider test card (demo only: never a real card). Sent to
            the provider once to authorize; only the last four digits are kept.
          example: "4242424242424242"

    OrderStatus:
      type: string
      enum: [placed, paid, accepted, ready, picked_up, delivered, cancelled]
      description: |
        `placed` → `paid` → `accepted` → `ready` → `picked_up` → `delivered`, or
        `cancelled` (see `cancel_reason`).
        `picked_up` and `delivered` come with drivers, in a later version.

    CancelReason:
      type: string
      enum: [payment_failed, rejected, by_customer, expired]
      description: |
        `payment_failed`: the card was declined. `rejected`: the restaurant said no.
        `by_customer`: you cancelled. `expired`: not paid within 15 minutes.

    Order:
      type: object
      required: [id, restaurant_id, restaurant_name, status, cancel_reason, address, items, subtotal_kurus, delivery_fee_kurus, total_kurus, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        restaurant_name:
          type: string
          description: As it was when the order was placed.
          example: Hasan Usta Kebap Kadıköy
        status: { $ref: "#/components/schemas/OrderStatus" }
        cancel_reason:
          description: Set exactly when `status` is `cancelled`.
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CancelReason" }]
        address: { $ref: "#/components/schemas/DeliveryAddress" }
        items:
          type: array
          description: The dishes, in the order they were in the cart.
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal_kurus: { type: integer, example: 118000 }
        delivery_fee_kurus: { type: integer, example: 2990 }
        total_kurus:
          type: integer
          description: Subtotal plus delivery fee.
          example: 120990
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: When the status last changed.

    DeliveryAddress:
      type: object
      description: A copy of the address the order goes to, as it was at checkout.
      required: [label, address_line, details, lat, lng]
      properties:
        label: { type: string, example: Ev }
        address_line: { type: string, example: "Caferağa Mh., Moda Cd. No:40, Kadıköy" }
        details: { type: string, example: "Kat 3, daire 7" }
        lat: { type: number, format: double, example: 40.984 }
        lng: { type: number, format: double, example: 29.027 }

    OrderItem:
      type: object
      required: [id, menu_item_id, name, quantity, unit_price_kurus, line_total_kurus, options]
      properties:
        id: { type: string, format: uuid }
        menu_item_id:
          type: string
          format: uuid
          description: The dish it came from. It may since have left the menu.
        name: { type: string, example: Adana Kebap }
        quantity: { type: integer, minimum: 1, maximum: 20, example: 2 }
        unit_price_kurus:
          type: integer
          description: The dish plus its extras, as priced at checkout.
          example: 53000
        line_total_kurus:
          type: integer
          description: unit_price_kurus × quantity.
          example: 106000
        options:
          type: array
          items: { $ref: "#/components/schemas/OrderItemOption" }

    OrderItemOption:
      type: object
      required: [choice_id, group_name, choice_name, extra_price_kurus]
      properties:
        choice_id: { type: string, format: uuid }
        group_name: { type: string, example: Boy }
        choice_name: { type: string, example: Büyük }
        extra_price_kurus: { type: integer, example: 8000 }

    OrderWithHistory:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [history]
          properties:
            history:
              type: array
              description: Every status change, oldest first. The first entry is the order being placed (`from` is null).
              items: { $ref: "#/components/schemas/StatusChange" }

    OrderWithPayment:
      description: An order with its history and, for the customer, its payment.
      allOf:
        - $ref: "#/components/schemas/OrderWithHistory"
        - type: object
          properties:
            payment: { $ref: "#/components/schemas/Payment" }

    PaymentStatus:
      type: string
      enum: [pending, unknown, processing, authorized, captured, voided, refunded, failed]
      description: |
        `pending`: being authorized right now. `unknown`: the provider didn't
        answer in time, and the backend is finding out (never by charging
        again). `processing`: the card's bank hasn't decided yet.
        `authorized`: the amount is held on the card. `captured`: taken.
        `voided`: the hold was dropped, nothing taken. `refunded`: given back.
        `failed`: nothing held; `decline_code` says why.

    Payment:
      type: object
      required: [amount_kurus, status, card_last4, decline_code, created_at, updated_at, events]
      properties:
        amount_kurus: { type: integer, example: 120990 }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        card_last4: { type: string, pattern: "^[0-9]{4}$", example: "4242" }
        decline_code:
          type: string
          nullable: true
          enum: [card_declined, insufficient_funds, card_rejected, no_answer, null]
          description: |
            Set exactly when `failed`. `card_declined`, `insufficient_funds`: the
            card's bank said no. `card_rejected`: not a card the provider takes.
            `no_answer`: the request never reached the provider.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        events:
          type: array
          description: The payment's ledger, oldest first. Lines are only ever added.
          items: { $ref: "#/components/schemas/PaymentEvent" }

    PaymentEvent:
      type: object
      required: [status, decline_code, via, at]
      properties:
        status: { $ref: "#/components/schemas/PaymentStatus" }
        decline_code:
          type: string
          nullable: true
        via:
          type: string
          enum: [request, reconcile, webhook]
          description: |
            How the backend learned it: `request` (the answer to its own call),
            `reconcile` (it asked the provider again later) or `webhook` (the
            provider told it).
        at: { type: string, format: date-time }

    StatusChange:
      type: object
      required: [from, to, cancel_reason, by, at]
      properties:
        from:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/OrderStatus" }]
        to: { $ref: "#/components/schemas/OrderStatus" }
        cancel_reason:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CancelReason" }]
        by:
          type: string
          enum: [customer, restaurant, driver, system]
          description: Who made the move. `system` is the backend on its own, e.g. expiring an unpaid order.
        at: { type: string, format: date-time }

    OrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }

    Restaurant:
      type: object
      required: [id, name, address, lat, lng, delivery_radius_m, delivery_fee_kurus, min_basket_kurus, accepting_orders, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Çiya Sofrası }
        address: { type: string, example: "Güneşli Bahçe Sk. No:43, Kadıköy" }
        lat: { $ref: "#/components/schemas/Latitude" }
        lng: { $ref: "#/components/schemas/Longitude" }
        delivery_radius_m:
          type: integer
          minimum: 500
          maximum: 10000
          description: How far the restaurant delivers, in metres.
          example: 3000
        delivery_fee_kurus: { $ref: "#/components/schemas/DeliveryFeeKurus" }
        min_basket_kurus: { $ref: "#/components/schemas/MinBasketKurus" }
        accepting_orders: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NearbyRestaurant:
      allOf:
        - $ref: "#/components/schemas/Restaurant"
        - type: object
          required: [distance_m]
          properties:
            distance_m:
              type: number
              format: double
              description: Distance from the search point, in metres.
              example: 273.4

    RestaurantCreate:
      type: object
      additionalProperties: false
      required: [name, address, lat, lng]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Çiya Sofrası }
        address: { type: string, minLength: 1, maxLength: 300, example: "Güneşli Bahçe Sk. No:43, Kadıköy" }
        lat: { $ref: "#/components/schemas/Latitude" }
        lng: { $ref: "#/components/schemas/Longitude" }
        delivery_radius_m:
          type: integer
          minimum: 500
          maximum: 10000
          default: 3000
        delivery_fee_kurus:
          allOf: [{ $ref: "#/components/schemas/DeliveryFeeKurus" }]
          default: 0
        min_basket_kurus:
          allOf: [{ $ref: "#/components/schemas/MinBasketKurus" }]
          default: 0

    RestaurantPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Send only what changes. `lat` and `lng` go together.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        lat: { $ref: "#/components/schemas/Latitude" }
        lng: { $ref: "#/components/schemas/Longitude" }
        delivery_radius_m: { type: integer, minimum: 500, maximum: 10000 }
        delivery_fee_kurus: { $ref: "#/components/schemas/DeliveryFeeKurus" }
        min_basket_kurus: { $ref: "#/components/schemas/MinBasketKurus" }
        accepting_orders: { type: boolean }

    DeliveryFeeKurus:
      type: integer
      minimum: 0
      maximum: 50000
      description: "Added to every order, in kuruş: 2990 = 29,90 TL. 0 means free delivery."
      example: 2990
    MinBasketKurus:
      type: integer
      minimum: 0
      maximum: 500000
      description: "The smallest subtotal (dishes and extras, before the delivery fee) the restaurant delivers, in kuruş. 0 means no minimum."
      example: 25000

    CategoryName:
      type: string
      minLength: 1
      maxLength: 60
      example: Kebaplar
    ItemName:
      type: string
      minLength: 1
      maxLength: 100
      example: Adana Kebap
    ItemDescription:
      type: string
      maxLength: 500
      example: Acılı, közlenmiş biberle
    PriceKurus:
      type: integer
      minimum: 1
      maximum: 10000000
      description: "Price in kuruş, as a whole number: 32000 = 320,00 TL. Decimals are rejected."
      example: 32000

    Category:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/CategoryName" }
        position:
          type: integer
          description: Display order, 1 first.
        archived_at:
          type: string
          format: date-time
          description: Only present when archived (only in the owner's view).

    Item:
      type: object
      required: [id, category_id, name, description, price_kurus, available, position]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/ItemName" }
        description: { type: string, description: "May be empty." }
        price_kurus: { $ref: "#/components/schemas/PriceKurus" }
        available:
          type: boolean
          description: false = sold out for now. Show greyed out; can't be ordered.
        position:
          type: integer
          description: Display order within its section, 1 first.
        archived_at:
          type: string
          format: date-time
          description: Only present when archived (only in the owner's view).

    OptionGroupName:
      type: string
      minLength: 1
      maxLength: 60
      example: Boy
    MinPicks:
      type: integer
      minimum: 0
      maximum: 20
      description: The fewest choices the customer must pick. 0 = optional group.
      example: 1
    MaxPicks:
      type: integer
      minimum: 1
      maximum: 20
      description: The most choices the customer may pick. Never below min_picks.
      example: 1
    OptionChoiceName:
      type: string
      minLength: 1
      maxLength: 100
      example: Büyük
    ExtraPriceKurus:
      type: integer
      minimum: 0
      maximum: 10000000
      description: "Added to the dish's price, in kuruş: 4000 = 40,00 TL. 0 = no extra charge."
      example: 4000

    OptionGroup:
      type: object
      description: |
        One question a dish asks, e.g. "Size: pick exactly 1" or "Extras: up to 3".
        min_picks 0 makes the group optional; min_picks = max_picks = 1 means
        "pick exactly one".
      required: [id, item_id, name, min_picks, max_picks, position]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/OptionGroupName" }
        min_picks: { $ref: "#/components/schemas/MinPicks" }
        max_picks: { $ref: "#/components/schemas/MaxPicks" }
        position:
          type: integer
          description: Display order within the item, 1 first.

    OptionChoice:
      type: object
      required: [id, group_id, name, extra_price_kurus, available, position]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/OptionChoiceName" }
        extra_price_kurus: { $ref: "#/components/schemas/ExtraPriceKurus" }
        available:
          type: boolean
          description: false = out for now. Show greyed out; can't be picked.
        position:
          type: integer
          description: Display order within the group, 1 first.

    MenuOptionGroup:
      allOf:
        - $ref: "#/components/schemas/OptionGroup"
        - type: object
          required: [choices]
          properties:
            choices:
              type: array
              items: { $ref: "#/components/schemas/OptionChoice" }

    MenuItem:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [option_groups]
          properties:
            option_groups:
              type: array
              description: The item's option groups with their choices, in display order. Empty if it has none.
              items: { $ref: "#/components/schemas/MenuOptionGroup" }

    MenuCategory:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/MenuItem" }

    Menu:
      type: object
      required: [restaurant_id, version, categories]
      properties:
        restaurant_id: { type: string, format: uuid }
        version:
          type: integer
          format: int64
          description: Goes up with every change to the menu. Compare it to know whether a stored copy is out of date.
        categories:
          type: array
          items: { $ref: "#/components/schemas/MenuCategory" }
