name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: quickbytes
          POSTGRES_PASSWORD: quickbytes
          POSTGRES_DB: quickbytes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quickbytes -d quickbytes_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://quickbytes:quickbytes@localhost:5432/quickbytes_test?sslmode=disable
      TEST_PAYPROVIDER_DATABASE_URL: postgres://quickbytes:quickbytes@localhost:5432/payprovider_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The service container creates only quickbytes_test; the same script
      # as locally adds the payment provider's databases.
      - name: Create the other databases
        run: psql "$TEST_DATABASE_URL" -q -v ON_ERROR_STOP=1 -f scripts/init-databases.sql
      - run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t quickbytes-api .
      - name: Build the payment provider image
        run: docker build --build-arg SERVICE=payprovider -t quickbytes-payprovider .
